<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Stats preview card component</title>

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@600&family=Young+Serif&display=swap" rel="stylesheet">
</head>
  <link rel="stylesheet" href="style.css">
<body>

  <div class="main-con">
  <section class="image-purple">
  <picture>
    <source media="(min-width: 800px)" srcset="image-header-desktop.jpg">
    <img src="image-header-mobile.jpg" alt="image-women-with-laptop">
  </picture>
</section>

    <section class="text">
  <h1 class="inter-bold">
      Get <span style="color:hsl(277, 64%, 61%)">insights</span> that help your business grow.
  </h1>

    <p class="lexend-deca paragraph" style="font-size: 12px; color: rgb(194, 189, 189); line-height: 1.5;">
  Discover the benefits of data analytics and make better decisions regarding revenue, customer 
  experience, and overall efficiency.
   </p>


  <div class="stats inter">
  <div>
    <h3>10k+</h3>
    <p>COMPANIES</p>
  </div>
  <div>
    <h3>314</h3>
    <p>TEMPLATES</p>
  </div>
  <div>
    <h3>12M+</h3>
    <p>QUERIES</p>
  </div>
</div>
  </section>
  </div> 
  
  <div class="attribution" style="color: white;">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/home">Paola Prajz</a>.
  </div>
</body>
</html>
